<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flap Mirror</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
  <header class="top">
    <label class="pick">
      <select id="density" aria-label="Flap size">
        <option value="32">Large flaps</option>
        <option value="48" selected>Medium flaps</option>
        <option value="72">Small flaps</option>
      </select>
    </label>

    <h1>Flap Mirror</h1>

    <div class="meter">
      <div class="meter-row"><span id="state">Waiting</span><span id="count">0%</span></div>
      <div class="meter-line"><i id="progress"></i></div>
    </div>
  </header>

  <main class="stage">
    <div class="board">
      <canvas id="board"></canvas>
      <div class="start" id="start">
        <button id="useCamera">Start the mirror</button>
        <label class="link">or use a photo<input type="file" id="usePhoto" accept="image/*" hidden></label>
        <p class="note" id="startNote"></p>
      </div>
    </div>
  </main>

  <nav class="actions">
    <button id="scramble">Scramble</button>
    <button id="sound" class="on">Sound on</button>
    <button id="record">Record a clip</button>
  </nav>

  <footer class="foot">
    Flap Mirror · <a href="../">Daily</a> 002 · Hold still and the flaps find your face. Move and they lose it. Nothing leaves your browser.
  </footer>

  <script type="module" src="app.js?v=4"></script>
</body>
</html>
