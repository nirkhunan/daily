<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>30 Day Map Challenge</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="style.css?v=8">
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/deck.gl@9.0.38/dist.min.js"></script>
</head>
<body data-mode="explore">
  <main class="app">
    <section class="stage">
      <div id="explore"></div>
      <canvas id="map"></canvas>
    </section>

    <aside class="panel">
      <header>
        <p class="kicker">30 Day Map Challenge</p>
        <h1>&nbsp;</h1>
        <nav id="days" class="days" aria-label="Days"></nav>
      </header>

      <div id="modes" class="seg">
        <button data-mode="explore">Explore</button>
        <button data-mode="poster">Poster</button>
      </div>

      <button id="frameView" class="primary only-explore">Make a poster of this view</button>
      <button id="wholeCity" class="only-poster">Show the whole city</button>

      <div id="options"></div>

      <section class="group">
        <h2>Colour</h2>
        <div id="swatches" class="swatches"></div>
      </section>

      <div id="legend"></div>

      <section class="group only-poster">
        <label class="check"><input id="grid" type="checkbox"> <span id="gridLabel">Turn to the Manhattan grid</span></label>
        <h2 style="margin-top:18px">Export</h2>
        <div class="row">
          <button id="export1" class="primary">1080 × 1350</button>
          <button id="export2">2160 × 2700</button>
        </div>
      </section>
    </aside>
  </main>
  <script type="module" src="app.js?v=11"></script>
</body>
</html>
