<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daily</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #F6F5F2; --ink: #141414; --muted: #6B6A66; --line: #E2E0DA; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0D0F12; --ink: #E6E9EC; --muted: #8B8F94; --line: #23272C; } }
    * { box-sizing: border-box; margin: 0; }
    body { background: var(--bg); color: var(--ink); font: 15px/1.5 "Instrument Sans", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    main { max-width: 760px; margin: 0 auto; padding: 96px 24px; }
    .kicker { font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
    h1 { font: 72px/1 "Instrument Serif", Georgia, serif; margin: 8px 0 56px; }
    ol { list-style: none; padding: 0; border-top: 1px solid var(--line); }
    li a { display: grid; grid-template-columns: 64px 1fr auto; gap: 16px; align-items: baseline; padding: 20px 0; border-bottom: 1px solid var(--line); color: inherit; text-decoration: none; }
    li a:hover .name { text-decoration: underline; text-underline-offset: 4px; }
    .no { color: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: .1em; }
    .name { font: 32px/1.1 "Instrument Serif", Georgia, serif; }
    .what { color: var(--muted); }
    @media (max-width: 560px) { li a { grid-template-columns: 48px 1fr; } .what { grid-column: 2; } h1 { font-size: 56px; } }
  </style>
</head>
<body>
  <main>
    <p class="kicker">One a day</p>
    <h1>Daily</h1>
    <ol>
      <li><a href="001-song-fabric/"><span class="no">001</span><span class="name">Song Fabric</span><span class="what">Make a loop. Watch it weave.</span></a></li>
      <li><a href="002-flap-mirror/"><span class="no">002</span><span class="name">Flap Mirror</span><span class="what">Hold still. The flaps find your face.</span></a></li>
      <li><a href="30daymap/"><span class="no">Map</span><span class="name">30 Day Map Challenge</span><span class="what">Thirty maps of New York, November 2026.</span></a></li>
    </ol>
  </main>
</body>
</html>
